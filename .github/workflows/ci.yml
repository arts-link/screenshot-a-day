name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sad/worker exec playwright install --with-deps chromium firefox webkit
      - name: Install Hugo Extended 0.146.2
        env:
          HUGO_SHA256: 1ed22c5b382afbb97f3115e73aad1f45377b909a84160b0b57ec680c67a48ceb
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl --fail --location --output "$RUNNER_TEMP/hugo/hugo.tar.gz" \
            https://github.com/gohugoio/hugo/releases/download/v0.146.2/hugo_extended_0.146.2_linux-amd64.tar.gz
          echo "$HUGO_SHA256  $RUNNER_TEMP/hugo/hugo.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/hugo/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Check out Ryder 0.4.1
        run: |
          git init "$RUNNER_TEMP/ryder"
          git -C "$RUNNER_TEMP/ryder" remote add origin https://github.com/arts-link/ryder.git
          git -C "$RUNNER_TEMP/ryder" fetch --depth 1 origin 309cd9c6bbd37950c94acdd3f07438e2036d76fb
          git -C "$RUNNER_TEMP/ryder" checkout --detach FETCH_HEAD
          echo "SAD_TEST_RYDER_PATH=$RUNNER_TEMP/ryder" >> "$GITHUB_ENV"
      - run: pnpm check
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: docker compose config --quiet
        env:
          SAD_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
          SAD_SESSION_SECRET: "ci-session-secret-1111111111111111"
          SAD_WORKER_TOKEN: "ci-worker-token-222222222222222222"
  container-smoke:
    runs-on: ubuntu-latest
    env:
      SAD_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      SAD_SESSION_SECRET: "ci-session-secret-1111111111111111"
      SAD_WORKER_TOKEN: "ci-worker-token-222222222222222222"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build images
        run: docker compose build
      - name: Start API
        run: docker compose up --detach api
      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4400/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Start worker
        run: docker compose up --detach worker
      - name: Verify services
        run: |
          docker compose ps
          docker compose ps --services --status running | grep --line-regexp api
          docker compose ps --services --status running | grep --line-regexp worker
      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down --volumes
