name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sad/worker exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
      - run: docker compose config --quiet
        env:
          SAD_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
          SAD_SESSION_SECRET: "ci-session-secret-1111111111111111"
          SAD_WORKER_TOKEN: "ci-worker-token-222222222222222222"
  container-smoke:
    runs-on: ubuntu-latest
    env:
      SAD_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      SAD_SESSION_SECRET: "ci-session-secret-1111111111111111"
      SAD_WORKER_TOKEN: "ci-worker-token-222222222222222222"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build images
        run: docker compose build
      - name: Start API
        run: docker compose up --detach api
      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4400/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Start worker
        run: docker compose up --detach worker
      - name: Verify services
        run: |
          docker compose ps
          docker compose ps --services --status running | grep --line-regexp api
          docker compose ps --services --status running | grep --line-regexp worker
      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down --volumes
