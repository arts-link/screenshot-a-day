name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out annotated tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate release tag and main tip
        run: |
          git fetch --no-tags origin main
          node scripts/check-release.mjs \
            "$GITHUB_REF_NAME" \
            "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" \
            "$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")" \
            "$(git rev-parse FETCH_HEAD)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sad/worker exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:e2e

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and publish multi-platform image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            SAD_VERSION=${{ steps.version.outputs.version }}
            SAD_COMMIT=${{ github.sha }}
      - name: Publish GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable digests and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          api="ghcr.io/${GITHUB_REPOSITORY}-api"
          worker="ghcr.io/${GITHUB_REPOSITORY}-worker"
          api_digest="$(docker buildx imagetools inspect "$api:$version" --format '{{json .Manifest}}' | jq --raw-output .digest)"
          worker_digest="$(docker buildx imagetools inspect "$worker:$version" --format '{{json .Manifest}}' | jq --raw-output .digest)"
          notes="$(mktemp)"
          cp "docs/releases/$GITHUB_REF_NAME.md" "$notes"
          {
            printf '\n## Immutable image digests\n\n'
            printf -- '- `%s@%s`\n' "$api" "$api_digest"
            printf -- '- `%s@%s`\n' "$worker" "$worker_digest"
          } >> "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Screenshot-a-Day $GITHUB_REF_NAME" \
            --notes-file "$notes"
